// 检查文章访问权限
async function checkAccess(event, url, access) {
  event.preventDefault();
  
  const token = localStorage.getItem('sandbot_token');
  const API_URL = 'https://sandbot-membership.sandmark78.workers.dev';
  
  // 检查权限
  try {
    const res = await fetch(`${API_URL}/api/check-access`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, articleId: url, articleAccess: access }),
    });
    const data = await res.json();
    
    if (data.allowed) {
      // 更新游客计数
      if (!token) {
        incrementGuestReadCount();
      }
      window.location.href = url;
    } else if (data.reason === 'login_required') {
      // 需要登录
      if (confirm('需要登录才能阅读更多文章，是否前往登录？')) {
        window.location.href = '/login';
      }
    } else if (data.reason === 'upgrade_required') {
      // 需要升级
      if (confirm('这是付费会员专属文章，是否升级会员？')) {
        window.location.href = '/membership';
      }
    } else {
      alert('无法访问此文章');
    }
  } catch (e) {
    console.error('Check access error:', e);
    // 降级处理：允许访问
    window.location.href = url;
  }
}

// 检查登录状态并更新 plan
async function checkLoginStatus() {
  const token = localStorage.getItem('sandbot_token');
  if (!token) return;
  
  const API_URL = 'https://sandbot-membership.sandmark78.workers.dev';
  try {
    const res = await fetch(`${API_URL}/api/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    
    if (data.valid) {
      localStorage.setItem('sandbot_plan', data.plan);
      localStorage.setItem('sandbot_email', data.email);
    } else {
      localStorage.removeItem('sandbot_token');
      localStorage.removeItem('sandbot_plan');
    }
  } catch (e) {
    console.error('Verify error:', e);
  }
}

// 页面加载时检查

function renderArticles() {
  const grid = document.getElementById('articleGrid');
  const filtered = getFilteredArticles();
  const visible = filtered.slice(0, currentPage * ITEMS_PER_PAGE);
  
  grid.innerHTML = visible.map(a => {
    return `
    <div class="article-card" data-tag="${a.tag}" data-title="${a.title}" data-access="${a.access}">
      <span class="access-badge ${a.access}">${a.access === 'free' ? '免费' : '会员'}</span>
      <div class="card-header">
        <span class="card-type ${a.type}">${a.typeLabel}</span>
      </div>
      <h3 class="card-title"><a href="${a.url}">${a.title}</a></h3>
      <p class="card-excerpt">${a.excerpt}</p>
      <div class="card-meta">
        <span>${a.date}</span>
        <span class="dot"></span>
        <span>${a.duration}</span>
      </div>
    </div>
  `}).join('');
  
  // Update stats
  document.getElementById('statsText').textContent = `显示 ${visible.length} / ${filtered.length} 篇`;
  
  // Show/hide load more button
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  if (visible.length >= filtered.length) {
    loadMoreBtn.classList.add('hidden');
  } else {
    loadMoreBtn.classList.remove('hidden');
  }
  
  // Show/hide no results
  document.querySelector('.no-results').classList.toggle('show', filtered.length === 0);
}

function loadMore() {
  currentPage++;
  renderArticles();
}

// Search
document.getElementById('searchBox').addEventListener('input', function(e) {
  currentQuery = e.target.value.toLowerCase();
  currentPage = 1;
  renderArticles();
});

// Filter
document.querySelectorAll('.filter-tag').forEach(tag => {
  tag.addEventListener('click', function() {
    document.querySelectorAll('.filter-tag').forEach(t => t.classList.remove('active'));
    this.classList.add('active');
    currentFilter = this.dataset.filter;
    currentPage = 1;
    renderArticles();
  });
});

// Initial render
renderArticles();

// 检查文章访问权限
async function checkAccess(event, url, access) {
  event.preventDefault();
  
  const token = localStorage.getItem('sandbot_token');
  const API_URL = 'https://sandbot-membership.sandmark78.workers.dev';
  
  // 检查权限
  try {
    const res = await fetch(`${API_URL}/api/check-access`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, articleId: url, articleAccess: access }),
    });
    const data = await res.json();
    
    if (data.allowed) {
      // 更新游客计数
      if (!token) {
        incrementGuestReadCount();
      }
      window.location.href = url;
    } else if (data.reason === 'login_required') {
      // 需要登录
      if (confirm('需要登录才能阅读更多文章，是否前往登录？')) {
        window.location.href = '/login';
      }
    } else if (data.reason === 'upgrade_required') {
      // 需要升级
      if (confirm('这是付费会员专属文章，是否升级会员？')) {
        window.location.href = '/membership';
      }
    } else {
      alert('无法访问此文章');
    }
  } catch (e) {
    console.error('Check access error:', e);
    // 降级处理：允许访问
    window.location.href = url;
  }
}

// 检查登录状态并更新 plan
async function checkLoginStatus() {
  const token = localStorage.getItem('sandbot_token');
  if (!token) return;
  
  const API_URL = 'https://sandbot-membership.sandmark78.workers.dev';
  try {
    const res = await fetch(`${API_URL}/api/verify`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    const data = await res.json();
    
    if (data.valid) {
      localStorage.setItem('sandbot_plan', data.plan);
      localStorage.setItem('sandbot_email', data.email);
    } else {
      localStorage.removeItem('sandbot_token');
      localStorage.removeItem('sandbot_plan');
    }
  } catch (e) {
    console.error('Verify error:', e);
  }
}

// 页面加载时检查
checkLoginStatus();
